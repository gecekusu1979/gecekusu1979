name: generate animation

on:
  # Her gece 12'de yılan otomatik çalışıp kodlarınızı yer
  schedule:
    - cron: "0 0 * * *" 
  
  # Manuel çalıştırmaya izin verir
  workflow_dispatch:
  
  # Main'e her kod ittiğinizde yılan tekrar canlanır
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Sizin profil ağacınızdan (Yesil kutular) Yılan SVG'si oluşturur
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Yılanı "output" adlı gizli bir dala kaydeder
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
